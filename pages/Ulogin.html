<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Secure user login for Dark Skull Corporation (DSC) premium dashboards and licensed software access.">

  <meta name="author" content="Dark Skull Corporation">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://dscweb.me/pages/Ulogin.html">
  <meta property="og:site_name" content="Dark Skull Corporation">
  <meta property="og:title" content="User Login | Dark Skull Corporation (DSC)">
  <meta property="og:description" content="Secure access to the DSC user dashboard and premium software account center.">
  <meta property="og:url" content="https://dscweb.me/pages/Ulogin.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://dscweb.me/images/dsclogo.png">
  <meta property="og:image:alt" content="Dark Skull Corporation logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="User Login | Dark Skull Corporation (DSC)">
  <meta name="twitter:description" content="Secure access to the DSC user dashboard and premium software account center.">
  <meta name="twitter:image" content="https://dscweb.me/images/dsclogo.png">
  <meta name="twitter:image:alt" content="Dark Skull Corporation logo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../images/dsclogo.png">
</head>
<body>
  <header class="site-header">
    <a class="logo-mark" href="../index.html">
      <img src="../images/dsclogo.png" alt="DSC" class="header-logo-img">
      <span class="logo-text">Dark Skull Corporation</span>
    </a>
    <div class="header-actions">
      <button type="button" id="theme-toggle-btn" class="btn btn-neutral theme-toggle" data-theme-toggle>Light Mode</button>
      <a class="btn btn-outline" href="../index.html">Home</a>
    </div>
  </header>

  <main class="center-wrap">
    <section class="auth-card">
      <h1 class="auth-title">User Login</h1>
      <p class="auth-subtitle">Access your premium software dashboard.</p>

      <form id="userLoginForm" class="stack" autocomplete="off">
        <div class="input-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="link-row">
        <a href="Alogin.html">Admin Login</a>
        <a href="../index.html">Back to Home</a>
      </div>
    </section>
  </main>

  <script src="../js/main.js" defer></script>
</body>
</html>
