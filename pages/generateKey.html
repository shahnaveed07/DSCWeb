<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Key | Dark Skull Corporation</title>
  <meta name="robots" content="noindex, nofollow">
 
  <script src="../js/core/theme-init.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../images/dsclogo.png">
  <style id="page-guard-style">body { display: none; }</style>
</head>
<body>
  <header class="site-header">
    <a class="logo-mark" href="../index.html">
      <img src="../images/dsclogo.png" alt="DSC" class="header-logo-img">
      <span class="logo-text">Dark Skull Corporation</span>
    </a>
    <div class="header-actions">
      <span class="current-page-label" data-current-page-label data-page-label="Generate Key">Generate Key</span>
      <button type="button" id="theme-toggle-btn" class="btn btn-neutral theme-toggle" data-theme-toggle>Light Mode</button>
      <a class="btn btn-outline" href="Adash.html">Back to Dashboard</a>
      <div class="menu-container">
        <button type="button" class="btn btn-neutral menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="primary-menu">
          <span aria-hidden="true">☰</span>
          <span>Menu</span>
        </button>
        <nav id="primary-menu" class="menu-panel" aria-label="Primary navigation" hidden>
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link" href="apps.html">Apps</a>
          <a class="nav-link" href="products.html">Products</a>
          <a class="nav-link" href="downloads.html">Downloads</a>
          <a class="nav-link" href="about.html">About</a>
          <a class="nav-link" href="contact.html">Contact</a>
          <a class="nav-link" href="https://discord.gg/XB2Zjmsb7K" target="_blank" rel="noopener noreferrer">Discord</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="center-wrap">
    <section class="auth-card">
      <h1 class="auth-title">Generate Access Key</h1>
      <p class="auth-subtitle">Create a new key for software access.</p>

      <!-- Key generation form block -->
      <form id="generateKeyForm" class="stack" autocomplete="off">
        <div class="input-group">
          <label for="planName">Select Plan</label>
          <select id="planName" required>
            <option value="" disabled selected>-- Choose a Plan --</option>
            <option value="free">Free Panel</option>
            <option value="streamer">Streamer Panel</option>
            <option value="sniper">Sniper Panel</option>
            <option value="special">Special Panel</option>
            <option value="aimbot">Aimbot Panel</option>
            <option value="premium">Premium Panel</option>
            <option value="customised">Customised Panel</option>
          </select>
        </div>

        <div class="input-group">
          <label for="validDays">Valid Days</label>
          <input id="validDays" type="number" min="1" placeholder="Example: 30" required>
        </div>

        <button type="submit" class="btn btn-primary">Generate Key</button>
      </form>

      <!-- Generated key block -->
      <article class="key-result">
        <p class="key-result-label">Generated Key</p>
        <p class="key-result-value fw-bold tracking-wide" id="generatedKeyValue">--</p>
        <button type="button" id="copyKeyBtn" class="btn btn-neutral btn-full mt-10 d-none">Copy Key</button>
      </article>
    </section>
  </main>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
