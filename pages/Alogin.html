<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Dark Skull Corporation</title>
  <meta name="robots" content="noindex, nofollow">
 
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../images/dsclogo.png">
</head>
<body>
  <header class="site-header">
    <a class="logo-mark" href="../index.html">
      <img src="../images/dsclogo.png" alt="DSC" class="header-logo-img">
      <span class="logo-text">Dark Skull Corporation</span>
    </a>
    <div class="header-actions">
      <button type="button" id="theme-toggle-btn" class="btn btn-neutral theme-toggle" data-theme-toggle>Light Mode</button>
      <a class="btn btn-outline" href="../index.html">Home</a>
    </div>
  </header>

  <main class="center-wrap">
    
    <section class="auth-card">
      <h1 class="auth-title">Admin Login</h1>
      <p class="auth-subtitle">Restricted control panel access.</p>

      <form id="adminLoginForm" class="stack" autocomplete="off">
        <div class="input-group">
          <label for="adminUsername">Username</label>
          <input id="adminUsername" name="adminUsername" type="text" placeholder="Admin username" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-danger btn-block">Admin Login</button>
      </form>

      <div class="link-row">
        <a href="Ulogin.html">User Login</a>
        <a href="../index.html">Back to Home</a>
      </div>
    </section>
    
  </main>

  <script src="../js/main.js" defer></script>
</body>
</html>
